const SWATCH = (hex) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><rect width="300" height="200" fill="' + hex + '"/></svg>');

let uid = 100;

function chain(table) {
  let op = 'select', eqs = {}, payload = null, wantSingle = false;
  const api = {
    select(){ return api; },
    order(){ return api; },
    single(){ wantSingle = true; return api; },
    eq(col, v){ eqs[col] = v; return api; },
    update(p){ op = 'update'; payload = p; return api; },
    insert(p){ op = 'insert'; payload = p; return api; },
    delete(){ op = 'delete'; return api; },
    then(res, rej){
      const rows = DB[table] || [];
      let out;
      if (op === 'insert') {
        const rec = Object.assign({ id: 'g' + (++uid), created_at: new Date().toISOString() }, payload);
        rows.unshift(rec); out = { data: rec, error: null };
      } else if (op === 'update') {
        const rec = rows.find(r => r.id === eqs.id);
        if (rec) { Object.assign(rec, payload); rec.updated_at = new Date().toISOString(); }
        out = { data: rec || null, error: rec ? null : { message: 'nema reda' } };
      } else if (op === 'delete') {
        DB[table] = rows.filter(r => r.id !== eqs.id); out = { data: null, error: null };
      } else {
        let list = rows.filter(r => Object.keys(eqs).every(k => r[k] === eqs[k]));
        out = { data: wantSingle ? (list[0] || null) : list, error: null };
      }
      return Promise.resolve(out).then(res, rej);
    },
    catch(){ return api; },
  };
  return api;
}
